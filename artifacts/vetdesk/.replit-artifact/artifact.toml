kind = "web"
previewPath = "/"
title = "VetDesk"
version = "1.0.0"
id = "artifacts/vetdesk"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22681

[services.development]
run = "pnpm --filter @workspace/vetdesk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vetdesk", "run", "build" ]
serve = "static"
publicDir = "artifacts/vetdesk/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22681"
BASE_PATH = "/"
